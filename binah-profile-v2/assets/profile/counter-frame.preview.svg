<title id="t">World line</title><desc id="d">Profile views on animated Nixie tubes. It's the choice of Steins Gate.</desc>
<defs><style>@font-face{font-family:BMono;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:BMonoMed;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:BSerifItalic;src:url(data:font/woff;base64,) format('woff');}
.blink{animation:blink 1.2s steps(1) infinite}@keyframes blink{50%{opacity:0}}

