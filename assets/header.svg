<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Binah</title>
  <desc id="desc">A quiet night-sky banner with orbit lines and an open book</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#161a31"/>
      <stop offset="1" stop-color="#20213f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#8ea6ff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#7669c9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c5ff"/>
      <stop offset=".5" stop-color="#f2eafa"/>
      <stop offset="1" stop-color="#9fd9e8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="round">
      <rect width="1200" height="360" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>

    <g fill="#d9ddff">
