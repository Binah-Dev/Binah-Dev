<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Binah</title>
  <desc id="desc">An animated night-sky banner with orbit lines, a passing comet, and an open book</desc>

  <defs>
    <style>
      .glow { animation: breathe 7s ease-in-out infinite; }
      .orbit-a { transform-origin: 600px 178px; animation: orbit-a 14s ease-in-out infinite; }
      .orbit-b { transform-origin: 600px 178px; animation: orbit-b 18s ease-in-out infinite; }
      .orbit-dash { stroke-dasharray: 9 17; animation: dash 12s linear infinite; }
      .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
      .twinkle-b { animation-delay: -1.2s; animation-duration: 4.7s; }
      .twinkle-c { animation-delay: -2.4s; animation-duration: 5.4s; }
      .planet-glow { animation: pulse 4.8s ease-in-out infinite; }
      .planet-glow-b { animation-delay: -2.1s; }
      .spark { transform-box: fill-box; transform-origin: center; animation: spark 5s ease-in-out infinite; }
      .spark-b { animation-delay: -2.5s; }
      .title { animation: title-glow 6s ease-in-out infinite; }
      .book { transform-origin: 600px 280px; animation: float 5.8s ease-in-out infinite; }
      .comet { opacity: 0; animation: comet 11s cubic-bezier(.4, 0, .2, 1) infinite; }

      @keyframes breathe {
        0%, 100% { opacity: .72; }
        50% { opacity: 1; }
      }
      @keyframes orbit-a {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }
      @keyframes orbit-b {
        0%, 100% { transform: rotate(2.5deg); }
        50% { transform: rotate(-2.5deg); }
      }
      @keyframes dash { to { stroke-dashoffset: -104; } }
      @keyframes twinkle {
        0%, 100% { opacity: .32; transform: scale(.72); }
        50% { opacity: 1; transform: scale(1.35); }
      }
      @keyframes pulse {
        0%, 100% { opacity: .08; transform: scale(.82); }
        50% { opacity: .22; transform: scale(1.16); }
      }
      @keyframes spark {
        0%, 100% { opacity: .35; transform: scale(.78) rotate(0deg); }
        50% { opacity: .9; transform: scale(1.18) rotate(45deg); }
      }
      @keyframes title-glow {
        0%, 100% { opacity: .9; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(174, 190, 255, .34)); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes comet {
        0%, 64% { opacity: 0; transform: translate(-120px, 150px); }
        67% { opacity: 0; }
        70% { opacity: .9; }
        83% { opacity: .9; }
        88%, 100% { opacity: 0; transform: translate(1340px, -95px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .glow, .orbit-a, .orbit-b, .orbit-dash, .twinkle, .planet-glow,
        .spark, .title, .book, .comet { animation: none !important; }
        .comet { display: none; }
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#161a31"/>
      <stop offset="1" stop-color="#20213f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#8ea6ff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#7669c9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c5ff"/>
      <stop offset=".5" stop-color="#f2eafa"/>
      <stop offset="1" stop-color="#9fd9e8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="round">
      <rect width="1200" height="360" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect class="glow" width="1200" height="360" fill="url(#glow)"/>

    <g fill="#d9ddff">
      <circle class="twinkle" cx="93" cy="72" r="1.3"/>
      <circle class="twinkle twinkle-b" cx="172" cy="124" r="1.8"/>
      <circle class="twinkle twinkle-c" cx="252" cy="56" r="1.1"/>
      <circle class="twinkle twinkle-b" cx="334" cy="99" r="1.5"/>
      <circle class="twinkle" cx="414" cy="43" r="1.2"/>
      <circle class="twinkle twinkle-c" cx="504" cy="91" r="1.7"/>
      <circle class="twinkle twinkle-b" cx="708" cy="52" r="1.4"/>
      <circle class="twinkle" cx="798" cy="103" r="1.1"/>
      <circle class="twinkle twinkle-c" cx="896" cy="61" r="1.8"/>
      <circle class="twinkle twinkle-b" cx="1018" cy="106" r="1.2"/>
      <circle class="twinkle" cx="1110" cy="55" r="1.5"/>
      <circle class="twinkle twinkle-c" cx="1070" cy="245" r="1.2"/>
      <circle class="twinkle" cx="940" cy="290" r="1.6"/>
      <circle class="twinkle twinkle-b" cx="216" cy="281" r="1.1"/>
      <circle class="twinkle twinkle-c" cx="116" cy="236" r="1.5"/>
    </g>

    <g fill="none" stroke="#9baafa" stroke-width="1">
      <g class="orbit-a"><ellipse cx="600" cy="178" rx="465" ry="112" opacity=".12" transform="rotate(-7 600 178)"/></g>
      <g class="orbit-b"><ellipse cx="600" cy="178" rx="390" ry="82" opacity=".16" transform="rotate(5 600 178)"/></g>
      <path class="orbit-dash" d="M94 225C288 112 415 93 600 148c186 56 322 64 508-28" opacity=".16"/>
    </g>

    <circle cx="276" cy="128" r="4" fill="#a6dcf0"/>
    <circle class="planet-glow" cx="276" cy="128" r="14" fill="#a6dcf0" filter="url(#soft)"/>
    <circle cx="980" cy="102" r="3.5" fill="#c2b7ff"/>
    <circle class="planet-glow planet-glow-b" cx="980" cy="102" r="13" fill="#c2b7ff" filter="url(#soft)"/>

    <g class="comet" aria-hidden="true">
      <path d="M0 0L-78 28" fill="none" stroke="url(#ink)" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
      <circle cx="0" cy="0" r="3.2" fill="#eef1ff"/>
      <circle cx="0" cy="0" r="11" fill="#b9c5ff" opacity=".13" filter="url(#soft)"/>
    </g>

    <g transform="translate(536 36)" fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round">
      <path class="spark" d="M64 5v22M53 16h22" stroke-width="1.2" opacity=".7"/>
      <path class="spark spark-b" d="M27 31l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" stroke-width="1" opacity=".45"/>
      <path class="spark" d="M100 34l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" stroke-width="1" opacity=".6"/>
    </g>

    <text class="title" x="600" y="166" text-anchor="middle" fill="url(#ink)" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="14">BINAH</text>
    <text x="600" y="208" text-anchor="middle" fill="#c5c9df" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="5" opacity=".8">ALGORITHMS · IDEAS · INFINITE WORLDS</text>

    <g class="book">
      <g transform="translate(525 250)" fill="none" stroke="#c6cbeb" stroke-linecap="round" stroke-linejoin="round">
        <path d="M75 54C55 37 30 34 3 38V2c27-4 52 2 72 20z" stroke-width="1.7" opacity=".74"/>
        <path d="M75 54c20-17 45-20 72-16V2c-27-4-52 2-72 20z" stroke-width="1.7" opacity=".74"/>
        <path d="M75 22v32" stroke-width="1.2" opacity=".58"/>
        <path d="M13 13c21-2 39 3 53 14M137 13c-21-2-39 3-53 14" stroke-width="1" opacity=".28"/>
      </g>
    </g>

    <path d="M0 332c186-18 306 22 474 3 172-20 319-10 454 1 104 9 190 1 272-17v41H0z" fill="#090d1a" opacity=".7"/>
  </g>
</svg>
